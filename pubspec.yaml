name: system_date_time_format
description: A plugin for getting date and time format patterns from device system settings.
version: 1.5.1
repository: https://github.com/Nikoro/system_date_time_format
issue_tracker: https://github.com/Nikoro/system_date_time_format/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  code_assets: ">=1.0.0 <3.0.0"
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  hooks: ">=1.0.0 <3.0.0"
  jni: ^1.1.2
  jni_flutter: ^1.0.4+1
  native_toolchain_c: ">=0.17.6 <0.20.0"
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  assets:
    - web/system_date_time_format.min.js

  plugin:
    platforms:
      web:
        pluginClass: SystemDateTimeFormatWeb
        fileName: system_date_time_format_web.dart
